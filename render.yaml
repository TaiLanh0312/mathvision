# Deploy MathVision PRO lên Render.com (Docker). Xem DEPLOY.md.
services:
  - type: web
    name: mathvision
    runtime: docker
    plan: free
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # nhập thủ công trong dashboard (bí mật)
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_GEOMETRY_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_REASONING_MODEL
        value: gemini-flash-lite-latest
